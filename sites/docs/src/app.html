<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Optional network fonts for the dogfood site; theme.css also self-hosts
		     Inter Variable, Source Serif 4 Variable, and JetBrains Mono for consumers. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Replay the showcase theme before first paint to avoid a flash on reload.
			// The resolved --token:value map is persisted by the theme store; no theme
			// data lives here.
			(function () {
				try {
					var vars = JSON.parse(localStorage.getItem('docsmith-theme-vars') || 'null');
					if (!vars) return;
					var root = document.documentElement;
					for (var k in vars) root.style.setProperty(k, vars[k]);
				} catch (e) {
					/* ignore */
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
