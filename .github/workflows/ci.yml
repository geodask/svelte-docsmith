name: CI

on:
  pull_request:
    # Changes that can't affect the build, tests or published packages.
    # Docs site pages live under sites/, so they are never ignored here.
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "docs/**"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/assets/**"
  # master is verified by the Release workflow, which calls this one before
  # publishing. A `push` trigger here would run the same checks twice.
  workflow_call:

# Cancel superseded runs on the same PR. Inside the Release workflow the group
# name carries "Release" and the run is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so page lastUpdated / sitemap lastmod are real dates.
          # A shallow clone would omit them (see commitDates in svelte-docsmith).
          fetch-depth: 0

      - name: Setup PNPM
        # Version is read from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Vite 7+ (Milestone 2) requires Node >= 20.19; pin ahead of it now.
          node-version: "22"
          cache: "pnpm"

      # Turbo's local cache, carried between runs: packages a PR didn't touch
      # replay their build/test results instead of running again.
      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Safety net: releases re-pin the template automatically (ci:version),
      # this catches a pin that went stale some other way.
      - name: Check the CLI template pin
        run: node scripts/sync-template-pin.mjs check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage gate)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Pack the publishable tarball so a reviewer can install exactly what
      # would ship to npm and run the README adoption steps against it.
      # Only useful on PRs; the release gate skips it.
      - name: Pack the library tarball
        if: github.event_name == 'pull_request'
        working-directory: packages/svelte-docsmith
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Upload the library tarball
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: svelte-docsmith-tarball
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
